<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Training Platform{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:64rem;margin:1rem auto;padding:0 1rem;color:#222}
nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ccc;padding-bottom:.5rem;margin-bottom:1rem}
nav form{margin-left:auto}
table{border-collapse:collapse;width:100%;margin:.5rem 0}th,td{border:1px solid #ddd;padding:.3rem .5rem;text-align:left}
label{display:block;margin:.4rem 0}input,select,textarea{font:inherit;padding:.2rem}
.flash{background:#eef6ff;border:1px solid #9bc;padding:.4rem .6rem;margin:.5rem 0}
.draft{color:#a60}fieldset{margin:1rem 0}
</style></head><body>
<nav><a href="/">Home</a>
{% if user %}<span>{{ user.name }} ({{ user.role }})</span>
<form method="post" action="/sign-out"><button>Sign out</button></form>{% endif %}</nav>
{% for message in get_flashed_messages() %}<div class="flash" role="status">{{ message }}</div>{% endfor %}
<main>{% block body %}{% endblock %}</main></body></html>
